version: '3'
services:
  mongo:
    image: mongo
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  mongo-express:
    image: mongo-express
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/

  db:
    image: postgres
    shm_size: 128mb
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: example
      POSTGRES_DB: seetickets

  jaeger:
    image: jaegertracing/jaeger
    ports:
      - 16686:16686 # UI
      - 4317:4317 # OTLP gRPC
      - 4318:4318 # OTLP HTTP, where the backend exports traces

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  sonarqube:
    image: sonarqube:community
    ports:
      - 9000:9000
    environment:
      # embedded Elasticsearch otherwise needs vm.max_map_count>=262144 inside the podman machine
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
